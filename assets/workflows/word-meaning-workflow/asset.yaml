apiVersion: asset.sap/v1
kind: Asset

metadata:
  name: word-meaning-workflow
  description: Accepts a word via webhook, finds its meaning using SAP AI Core, and sends the result to SAP Task Center for review.
  version: "1.0.0"
  type: n8nworkflow

projectVersion: "1"
sourceRoot: "."

workflow:
  definitionFile: word-meaning-workflow.n8n.json
  name: word-meaning-workflow
  ordId: sap.btpn8n:apiResource:ManagedN8nMcpServer:v1

provides:
  apis:
    - name: word_lookup
      path: /word-meaning-finder-bb112/word-meaning-workflow/word-lookup
      kind: rest
      description: Accepts a word as input and triggers the word meaning lookup workflow
      ordId: "sap.n8nwfrt:apiResource:word-meaning-finder-bb112_word-meaning-workflow.wordLookup:v1"
    - name: word_lookup_mcp_server
      kind: mcp-server
      description: MCP server for word lookup operations
      ordId: "sap.n8nwfrt:apiResource:word-meaning-finder-bb112_word-meaning-workflow.wordLookupMcpServer:v1"
